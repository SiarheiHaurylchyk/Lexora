# Self-hosted Jitsi Meet for Lexora (official images).
# Handbook: https://jitsi.github.io/handbook/docs/devops-guide/devops-guide-docker
#
# 1. cp .env.example .env  → fill PUBLIC_URL, CONFIG, passwords (see README)
# 2. docker compose up -d

services:
  web:
    image: jitsi/web:${JITSI_IMAGE_VERSION:-stable-9584}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - '${HTTP_PORT}:80'
      - '${HTTPS_PORT}:443'
    volumes:
      - ${CONFIG}/web:/config
      - ./http-local-custom-config.js:/config/custom-config.js:ro
      - ./http-local-custom-interface_config.js:/config/custom-interface_config.js:ro
      - ${CONFIG}/web/crontabs:/var/spool/cron/crontabs
      - ${CONFIG}/transcripts:/usr/share/jitsi-meet/transcripts
    env_file: .env
    networks:
      meet.jitsi:
    depends_on:
      - jvb

  prosody:
    image: jitsi/prosody:${JITSI_IMAGE_VERSION:-stable-9584}
    restart: ${RESTART_POLICY:-unless-stopped}
    expose:
      - '${XMPP_PORT:-5222}'
      - '${PROSODY_S2S_PORT:-5269}'
      - '5347'
      - '${PROSODY_HTTP_PORT:-5280}'
    volumes:
      - ${CONFIG}/prosody/config:/config
      - ${CONFIG}/prosody/prosody-plugins-custom:/prosody-plugins-custom
    env_file: .env
    networks:
      meet.jitsi:
        aliases:
          - ${XMPP_SERVER:-xmpp.meet.jitsi}

  jicofo:
    image: jitsi/jicofo:${JITSI_IMAGE_VERSION:-stable-9584}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - '127.0.0.1:${JICOFO_REST_PORT:-8888}:8888'
    volumes:
      - ${CONFIG}/jicofo:/config
    env_file: .env
    depends_on:
      - prosody
    networks:
      meet.jitsi:

  jvb:
    image: jitsi/jvb:${JITSI_IMAGE_VERSION:-stable-9584}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - '${JVB_PORT:-10000}:${JVB_PORT:-10000}/udp'
      - '127.0.0.1:${JVB_COLIBRI_PORT:-8080}:8080'
    volumes:
      - ${CONFIG}/jvb:/config
    env_file: .env
    depends_on:
      - prosody
    networks:
      meet.jitsi:

networks:
  meet.jitsi:
